[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeptector"
version = "0.1.0"
description = "Reproducible visual foundation-model baseline for deepfake detection research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8,<5", "pandas>=2.0", "pillow>=10", "pyyaml>=6", "scikit-learn>=1.3", "torch>=2.1", "transformers>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
deeptector-train = "deeptector.cli.train:main"
deeptector-evaluate = "deeptector.cli.evaluate:main"
deeptector-prepare-ffpp = "deeptector.cli.prepare_ffpp:main"
deeptector-prepare-ffpp-lomo = "deeptector.cli.prepare_ffpp_lomo:main"
deeptector-real-smoke = "deeptector.cli.real_smoke:main"
deeptector-benchmark-xpu = "deeptector.cli.benchmark_xpu:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
