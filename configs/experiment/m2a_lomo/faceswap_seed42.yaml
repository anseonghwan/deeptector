experiment_name: m2a_lomo_faceswap_seed42
seed: 42
data:
  train_manifest: data/manifests/ffpp_lomo_c23/faceswap.csv
  validation_manifest: data/manifests/ffpp_lomo_c23/faceswap.csv
  test_manifest: data/manifests/ffpp_lomo_c23/faceswap.csv
  lomo_protocol: data/manifests/ffpp_lomo_c23/protocol.json
  lomo_fold: faceswap
  lomo_held_out_manipulation: FaceSwap
  lomo_require_frozen_m1: true
  compression: c23
  frames_per_video: 8
  frame_sampling_strategy: uniform
  clip_length: 1
  input_resolution: 224
  face_margin: 0.2
  normalization: clip
  identity_disjoint: false
model:
  name: ${DEEPTECTOR_DATA_ROOT}/models/openai-clip-vit-base-patch16
  freeze_backbone: true
  local_files_only: true
  hidden_dim: null
train:
  epochs: 20
  balanced_sampling: true
  batch_size: 8
  amp_initial_scale: 1024
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  early_stopping_patience: 5
  num_workers: 0
evaluation:
  aggregation: mean
  top_k: 3
  threshold: 0.5
